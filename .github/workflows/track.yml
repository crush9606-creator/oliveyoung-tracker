name: olive tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright requests
      - run: python -m playwright install --with-deps chromium
      - run: python oliveyoung_tracker.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TOKEN: ${{ secrets.TOKEN }}
      - name: save barcode cache
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add barcodes.json || true
          git commit -m "update barcode cache [skip ci]" || echo "no cache change"
          git pull --rebase --autostash || true
          git push || echo "push skipped (will retry next run)"
